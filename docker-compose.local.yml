version: '3.8'

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n

  scraper:
    build: ./scraper
    ports:
      - "8000:8080" # Exposed on port 8000 locally
    environment:
      - PORT=8080

  llm-api:
    build: ./llm-api-cloud
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - LLM_PROVIDER=ollama
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - ENABLE_IMAGE_GEN=false
      - GEMINI_API_KEY= # Optional, leave empty if using Ollama
    extra_hosts:
      - "host.docker.internal:host-gateway" # Access host localhost (Windows/Linux)

volumes:
  n8n_data:
